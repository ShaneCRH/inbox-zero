name: Publish self-host image

# Builds the production Docker image on GitHub's free runners and publishes it
# to GitHub Container Registry so a small host (for example Render's free plan)
# can run it without building anything itself. Run it manually from the
# Actions tab. NEXT_PUBLIC_* values are placeholders that the container fills in
# from its environment at startup.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest
